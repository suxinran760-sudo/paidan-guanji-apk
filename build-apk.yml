
name: Build Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'paidan-guanjia-android-starter.zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unpack project
        run: |
          mkdir -p appsrc
          unzip -q paidan-guanjia-android-starter.zip -d appsrc

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        working-directory: appsrc
        run: npm install

      - name: Build web app
        working-directory: appsrc
        run: npm run build

      - name: Create Android project
        working-directory: appsrc
        run: npx cap add android

      - name: Sync Android
        working-directory: appsrc
        run: npx cap sync android

      - name: Build APK
        working-directory: appsrc/android
        run: chmod +x gradlew && ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: paidan-guanjia-apk
          path: appsrc/android/app/build/outputs/apk/debug/app-debug.apk
